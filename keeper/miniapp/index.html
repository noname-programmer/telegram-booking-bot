<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Keeper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём из темы Telegram пользователя (светлая или тёмная). */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #eff0f4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
    --text: var(--tg-theme-text-color, #0f1115);
    --hint: var(--tg-theme-hint-color, #8b8f99);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --link: var(--tg-theme-link-color, #2f7cf6);
    --line: rgba(128, 132, 145, .18);
    --soft: rgba(128, 132, 145, .12);
    --red: #e5484d;
    --amber: #f08c00;
    --green: #2fb36a;
    --violet: #7c5cff;
    --radius: 18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  /* Свои темы: пользователь может выбрать светлую или тёмную независимо от Telegram. */
  :root[data-theme="light"] { --bg: #eff0f4; --card: #fff; --text: #0f1115; --hint: #8b8f99; --accent: #2f7cf6; --accent-text: #fff; --link: #2f7cf6; }
  :root[data-theme="dark"] { --bg: #0e1014; --card: #1a1d24; --text: #f2f3f5; --hint: #8a909c; --accent: #6c8cff; --accent-text: #fff; --link: #8ea6ff;
                             --line: rgba(160, 166, 180, .16); --soft: rgba(160, 166, 180, .13); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); padding: 0 14px calc(92px + var(--safe-b));
         font: 15px/1.42 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; overflow-wrap: anywhere; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { display: block; }

  /* ---------- шапка ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 4px 12px; }
  .logo { width: 42px; height: 42px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff;
          background: linear-gradient(135deg, #7c5cff, #2f7cf6 55%, #22c1c3); box-shadow: 0 6px 16px rgba(76, 99, 255, .32); }
  .top h1 { margin: 0; font-size: 21px; line-height: 1.15; font-weight: 750; letter-spacing: -.3px; }
  .top p { margin: 2px 0 0; color: var(--hint); font-size: 13px; }
  .top .grow { flex: 1; min-width: 0; }
  .badge-pro { font-size: 11px; font-weight: 800; letter-spacing: .5px; padding: 4px 9px; border-radius: 999px; color: #fff;
               background: linear-gradient(135deg, #f7b500, #f0731b); }
  .badge-free { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; color: var(--hint); background: var(--soft); }

  /* ---------- общие блоки ---------- */
  .card { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .pad { padding: 14px 16px; }
  .section { margin: 18px 6px 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--hint); }
  .hint { color: var(--hint); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .tiles.two { grid-template-columns: repeat(2, 1fr); }
  .tile { background: var(--card); border-radius: 16px; padding: 12px 12px 11px; min-width: 0; }
  .tile b { display: block; font-size: 22px; line-height: 1.1; font-weight: 750; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .tile span { display: block; margin-top: 3px; font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.red b { color: var(--red); } .tile.amber b { color: var(--amber); } .tile.green b { color: var(--green); } .tile.violet b { color: var(--violet); }
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: var(--radius); margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(124, 92, 255, .16), rgba(47, 124, 246, .14)); font-size: 13.5px; }
  .banner .ico { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff;
                 background: linear-gradient(135deg, #7c5cff, #2f7cf6); }
  .banner b { display: block; font-size: 14.5px; margin-bottom: 1px; }
  .banner.warn { background: linear-gradient(135deg, rgba(240, 140, 0, .18), rgba(229, 72, 77, .12)); }
  .banner.warn .ico { background: linear-gradient(135deg, #f7b500, #f0731b); }

  .search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 0 12px; margin-bottom: 10px; color: var(--hint); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; padding: 11px 0; }
  .search input::placeholder { color: var(--hint); }

  .seg { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 14px; margin-bottom: 10px; }
  .seg button { flex: 1; padding: 8px 6px; border-radius: 10px; font-weight: 650; font-size: 13.5px; color: var(--hint); transition: background .18s, color .18s; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }

  /* ---------- аватар ---------- */
  .ava { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff;
         font-weight: 700; font-size: 17px; letter-spacing: .3px; }
  .ava.big { width: 68px; height: 68px; font-size: 25px; }
  .ava.small { width: 36px; height: 36px; font-size: 13.5px; }

  /* ---------- список чатов ---------- */
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px; position: relative; }
  .row + .row::before { content: ""; position: absolute; left: 72px; right: 0; top: 0; height: 1px; background: var(--line); }
  .row:active { background: var(--soft); }
  .row .mid { flex: 1; min-width: 0; }
  .row .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .row .name span { overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pills { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
          font-variant-numeric: tabular-nums; }
  .pill.red { color: var(--red); background: rgba(229, 72, 77, .13); }
  .pill.amber { color: var(--amber); background: rgba(240, 140, 0, .15); }
  .pill.gray { color: var(--hint); background: var(--soft); }
  .pill.green { color: var(--green); background: rgba(47, 179, 106, .15); }
  .pill.gold { color: #fff; background: linear-gradient(135deg, #f7b500, #f0731b); }
  .chev { color: var(--hint); opacity: .6; flex: none; }

  /* ---------- карточка собеседника ---------- */
  .hero { text-align: center; padding: 20px 16px 16px; }
  .hero .ava { margin: 0 auto 10px; }
  .hero h2 { margin: 0; font-size: 19px; font-weight: 720; }
  .hero .hint { margin-top: 2px; }
  .hero .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
  .hero .nums div { background: var(--soft); border-radius: 12px; padding: 8px 4px; }
  .hero .nums b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .hero .nums span { font-size: 11px; color: var(--hint); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; min-width: 0; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 12px; border-radius: 12px;
         font-weight: 650; font-size: 14px; background: var(--soft); color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.danger { background: rgba(229, 72, 77, .13); color: var(--red); }
  .btn:active { opacity: .7; } .btn:disabled { opacity: .5; }

  /* ---------- события (удалённые и изменённые сообщения) ---------- */
  .day { text-align: center; margin: 14px 0 8px; }
  .day span { font-size: 12px; font-weight: 650; color: var(--hint); background: var(--card); padding: 4px 11px; border-radius: 999px; }
  .ev { background: var(--card); border-radius: 16px; padding: 11px 13px 10px 16px; margin-bottom: 8px; position: relative; overflow: hidden; }
  .ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--red); }
  .ev.edited::before { background: var(--amber); }
  .ev.both::before { background: linear-gradient(var(--amber), var(--red)); }
  .ev-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .ev-head .who { font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-head time { color: var(--hint); font-size: 12.5px; flex: none; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 7px; flex: none; }
  .tag.red { color: var(--red); background: rgba(229, 72, 77, .13); }
  .tag.amber { color: var(--amber); background: rgba(240, 140, 0, .15); }
  .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--link); margin-bottom: 3px; }
  .ev .text { white-space: pre-wrap; }
  .ev .text.clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .more { color: var(--link); font-size: 13px; font-weight: 600; margin-top: 2px; }
  .was { margin: 0 0 6px; padding: 6px 9px; border-radius: 10px; background: var(--soft); }
  .was small { display: block; color: var(--hint); font-size: 11.5px; font-weight: 650; margin-bottom: 1px; }
  .was div { white-space: pre-wrap; color: var(--hint); text-decoration: line-through; text-decoration-color: rgba(128, 132, 145, .55); }
  .nowlabel { color: var(--hint); font-size: 11.5px; font-weight: 650; margin-bottom: 1px; }
  .facts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .fact { font-size: 11.5px; color: var(--hint); background: var(--soft); padding: 3px 8px; border-radius: 8px; white-space: nowrap; max-width: 100%;
          overflow: hidden; text-overflow: ellipsis; }
  .fact b { color: var(--text); font-weight: 600; }
  .ev .btn { margin-top: 9px; width: 100%; flex: none; padding: 8px 12px; font-size: 13.5px; }
  .lock { margin-top: 8px; font-size: 12.5px; color: var(--hint); }

  /* ---------- графики ---------- */
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 118px; padding-top: 6px; }
  .chart .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .chart .bar { border-radius: 5px 5px 2px 2px; min-height: 0; background: var(--red); transition: height .5s cubic-bezier(.2, .8, .2, 1); }
  .chart .bar.amber { background: var(--amber); } .chart .bar.blue { background: var(--accent); } .chart .bar.violet { background: var(--violet); }
  .chart .col.zero::after { content: ""; height: 3px; border-radius: 2px; background: var(--soft); }
  .axis { display: flex; gap: 4px; margin-top: 6px; }
  .axis span { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow-wrap: normal; font-size: 10px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--hint); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--red); }
  .legend i.amber { background: var(--amber); }
  .meter { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .meter .lbl { width: 108px; flex: none; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter .track { flex: 1; height: 8px; border-radius: 5px; background: var(--soft); overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #7c5cff, #2f7cf6); }
  .meter .val { width: 34px; flex: none; text-align: right; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 16px; position: relative; align-items: center; }
  .kv + .kv::before { content: ""; position: absolute; left: 16px; right: 0; top: 0; height: 1px; background: var(--line); }
  .kv span { color: var(--hint); flex: none; max-width: 62%; } .kv b { font-weight: 650; text-align: right; }

  /* ---------- профиль ---------- */
  .plan { padding: 18px 16px; color: #fff; border-radius: var(--radius); margin-bottom: 10px; position: relative; overflow: hidden;
          background: linear-gradient(135deg, #7c5cff, #2f7cf6 60%, #22c1c3); }
  .plan.pro { background: linear-gradient(135deg, #f7b500, #f0731b 60%, #e5484d); }
  .plan::after { content: ""; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255, 255, 255, .13); }
  .plan small { opacity: .85; font-size: 12.5px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; }
  .plan h2 { margin: 2px 0 6px; font-size: 24px; font-weight: 780; letter-spacing: -.4px; }
  .plan p { margin: 0; font-size: 13.5px; opacity: .93; max-width: 88%; }
  .plan ul { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .plan li { padding: 2px 0 2px 22px; position: relative; }
  .plan li::before { content: "✓"; position: absolute; left: 2px; font-weight: 800; }
  .plan .btn { margin-top: 12px; background: #fff; color: #1a1d24; position: relative; z-index: 1; width: 100%; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; width: 100%; text-align: left; }
  .opt + .opt::before { content: ""; position: absolute; left: 60px; right: 0; top: 0; height: 1px; background: var(--line); }
  .opt .ic { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--accent); }
  .opt .ic.red { background: var(--red); } .opt .ic.amber { background: var(--amber); } .opt .ic.green { background: var(--green); } .opt .ic.violet { background: var(--violet); }
  .opt .mid { flex: 1; min-width: 0; } .opt .mid div { font-weight: 600; } .opt .mid small { color: var(--hint); font-size: 12.5px; display: block; }
  .switch { flex: none; width: 48px; height: 29px; border-radius: 999px; background: var(--soft); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: #fff;
                   box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
  .switch.on { background: var(--green); } .switch.on::after { transform: translateX(19px); }
  .langs { display: flex; gap: 4px; background: var(--soft); padding: 3px; border-radius: 10px; flex: none; }
  .langs button { padding: 5px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--hint); }
  .langs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .steps { margin: 0; padding: 4px 16px 14px 36px; font-size: 14px; } .steps li { padding: 3px 0; }

  /* ---------- пустые экраны и загрузка ---------- */
  .empty { text-align: center; padding: 44px 24px; color: var(--hint); }
  .empty .ico { width: 68px; height: 68px; border-radius: 22px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--card); color: var(--accent); }
  .empty b { display: block; color: var(--text); font-size: 16.5px; margin-bottom: 4px; }
  .skel { height: 66px; border-radius: 16px; margin-bottom: 8px; background: linear-gradient(90deg, var(--card) 25%, var(--soft) 50%, var(--card) 75%);
          background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- нижнее меню ---------- */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 8px 12px calc(10px + var(--safe-b));
        pointer-events: none; }
  nav .bar { pointer-events: auto; display: flex; gap: 2px; width: 100%; max-width: 460px; padding: 6px; border-radius: 22px; background: var(--card);
             box-shadow: 0 8px 28px rgba(0, 0, 0, .16), 0 0 0 1px var(--line); }
  nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 6px; border-radius: 16px;
               color: var(--hint); font-size: 10.5px; font-weight: 650; transition: color .18s, background .18s; }
  nav button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav button.on { color: var(--accent); background: var(--soft); }
  .badge-vip { font-size: 11px; font-weight: 800; letter-spacing: .5px; padding: 4px 9px; border-radius: 999px; color: #fff;
               background: linear-gradient(135deg, #7c5cff, #e5489d); }
  .plan.vip { background: linear-gradient(135deg, #7c5cff, #b04ce0 55%, #e5489d); }
  .pill.vip { color: #fff; background: linear-gradient(135deg, #7c5cff, #e5489d); }
  .radio { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
  .radio.on { border-color: var(--accent); } .radio.on::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
  .field { width: 100%; border: 0; outline: 0; background: var(--soft); color: var(--text); font: inherit; padding: 11px 13px; border-radius: 12px; resize: none; }
  .field::placeholder { color: var(--hint); }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline .btn { flex: none; padding: 11px 16px; }
  .reflink { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--link); margin: 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.funnel { padding: 8px 16px; }
  .funnel .step { padding: 7px 0; }
  .funnel .step div:first-child { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; }
  .funnel .step b { font-variant-numeric: tabular-nums; }
  .funnel .track { height: 10px; border-radius: 6px; background: var(--soft); overflow: hidden; }
  .funnel .fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #2f7cf6, #22c1c3); }
  /* ---------- медиа внутри события ---------- */
  .media { margin-top: 8px; border-radius: 12px; overflow: hidden; background: var(--soft); position: relative; min-height: 54px; }
  .media img, .media video { display: block; width: 100%; max-height: 420px; object-fit: contain; background: #000; }
  .media.round video, .media.round img { aspect-ratio: 1; object-fit: cover; border-radius: 50%; max-width: 240px; margin: 8px auto; }
  .media.sticker { background: none; } .media.sticker img, .media.sticker video { max-width: 160px; background: none; }
  .media audio { display: block; width: 100%; }
  .media .play { position: absolute; inset: 0; display: grid; place-items: center; width: 100%; color: #fff; }
  .media .play i { width: 54px; height: 54px; border-radius: 50%; background: rgba(0, 0, 0, .55); display: grid; place-items: center; }
  .media .listen { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 13px; font-weight: 650; font-size: 14px; }
  .media .listen i { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; flex: none; }
  .media .wait { padding: 16px; text-align: center; color: var(--hint); font-size: 13px; }
  .ev .btn.ghost { background: var(--soft); color: var(--text); }
  /* ---------- выезжающая панель с действиями ---------- */
  .shade { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; animation: fade .15s; }
  .sheet { width: 100%; background: var(--card); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); animation: up .22s cubic-bezier(.2, .8, .2, 1); }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet h3 { margin: 0 0 2px; font-size: 18px; } .sheet p { margin: 0 0 14px; color: var(--hint); font-size: 13.5px; }
  .sheet .btn { width: 100%; margin-bottom: 8px; padding: 12px; }
  /* ---------- сообщение-«пузырь» и история правок ---------- */
  .bubble { white-space: pre-wrap; font-size: 15.5px; line-height: 1.45; padding: 9px 12px; border-radius: 4px 16px 16px 16px; background: var(--soft); }
  .bubble.clamp { display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; }
  .kindline { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 650; margin-bottom: 6px; padding: 3px 9px 3px 7px;
              border-radius: 999px; background: var(--soft); }
  .hist-title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 750; letter-spacing: .4px; text-transform: uppercase;
                color: var(--amber); margin: 2px 0 8px; }
  .hist { position: relative; padding-left: 26px; }
  .hist::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 14px; width: 2px; border-radius: 1px;
                  background: linear-gradient(var(--line), var(--amber) 70%, var(--green)); }

// Создаёт элемент. Текст вставляется как текст, а не как HTML — так чужое сообщение не сломает страницу.
function h(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;          // только для наших значков
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'style') node.style.cssText = v;
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

// ---------- время, размеры, имена ----------
const locale = () => ({ ru: 'ru-RU', uz: 'uz-UZ', en: 'en-GB' })[lang] || 'en-GB';
const clock = (unix) => new Date(unix * 1000).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
const dayKey = (unix) => { const d = new Date(unix * 1000); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
function dayName(unix) {
  const today = Date.now() / 1000;
  if (dayKey(unix) === dayKey(today)) return L.today;
  if (dayKey(unix) === dayKey(today - 86400)) return L.yesterday;
  return new Date(unix * 1000).toLocaleDateString(locale(), { day: 'numeric', month: 'long' });
}
const shortDate = (unix) => new Date(unix * 1000).toLocaleDateString(locale(), { day: '2-digit', month: '2-digit' });
const fullDate = (unix) => new Date(unix * 1000).toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' });
const midDate = (unix) => new Date(unix * 1000).toLocaleDateString(locale(), { day: 'numeric', month: 'short', year: 'numeric' });
const stamp = (unix) => (dayKey(unix) === dayKey(Date.now() / 1000) ? clock(unix) : `${shortDate(unix)} ${clock(unix)}`);
function span(sec) {
  const u = L.units;
  if (sec < 60) return `${Math.max(1, Math.round(sec))} ${u.s}`;
  if (sec < 3600) return `${Math.round(sec / 60)} ${u.m}`;
  if (sec < 86400) return `${Math.round(sec / 360) / 10} ${u.h}`;
  return `${Math.round(sec / 8640) / 10} ${u.d}`;
}
const bytes = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 102.4) / 10} KB` : `${Math.round(n / 104857.6) / 10} MB`);
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

const PALETTE = [['#ff8a5c', '#ff5e62'], ['#f7b500', '#f0731b'], ['#7c5cff', '#b06cff'], ['#2fb36a', '#22c1a3'], ['#22b8e6', '#2f7cf6'], ['#ff6fae', '#e5484d'], ['#5c7cfa', '#7c5cff']];
function avatar(name, id, cls = '') {
  const [a, b] = PALETTE[Math.abs(Number(id) || 0) % PALETTE.length];
  const letters = Array.from(String(name || '?').trim()).filter((c) => /\p{L}|\p{N}/u.test(c));
  const words = String(name || '').trim().split(/\s+/).filter(Boolean);
  const initials = (words.length > 1 ? Array.from(words[0])[0] + Array.from(words[1])[0] : letters.slice(0, 1).join('')) || '?';
  return h('div', { class: `ava ${cls}`, style: `background: linear-gradient(135deg, ${a}, ${b})` }, initials.toUpperCase());

// Экран с цифровой клавиатурой. Возвращает введённый код или null, если нажали «Отмена».
// check(code) — необязательная проверка: вернёт текст ошибки, и экран останется открытым.
function askPin(title, hint, { cancel = true, check = null } = {}) {
  return new Promise((resolve) => {
    let code = '';
    const dots = h('div', { class: 'dots' });
    const note = h('p', {}, hint);
    const ok = h('button', { class: 'flat' }, 'OK');
    const paint = () => {
      dots.replaceChildren(...(code ? Array.from(code, () => h('i')) : Array.from({ length: 4 }, () => h('i', { class: 'ghost' }))));
      ok.disabled = code.length < 4;
    };
    const press = (d) => { haptic(); if (code.length < 8) { code += d; note.className = ''; note.textContent = hint; paint(); } };
    const submit = async () => {
      if (code.length < 4) return;
      ok.disabled = true;
      const problem = check ? await check(code) : null;
      if (!problem) { screen.remove(); return resolve(code); }
      try { tg.HapticFeedback.notificationOccurred('error'); } catch { /* нет вибрации */ }
      code = ''; note.className = 'err'; note.textContent = problem; paint();
    };
    ok.onclick = submit;
    const screen = h('div', { class: 'lock-screen' },
      h('div', { class: 'logo', html: icon('lock', 30) }), h('h2', {}, title), note, dots,
      h('div', { class: 'keys' },
        [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => h('button', { onclick: () => press(d) }, d)),
        h('button', { class: 'flat', html: icon('back', 24), onclick: () => { haptic(); code = code.slice(0, -1); paint(); } }),
        h('button', { onclick: () => press(0) }, 0), ok),
      cancel && h('button', { class: 'cancel', onclick: () => { screen.remove(); resolve(null); } }, L.cancel));
    paint();
    document.body.append(screen);
  });
}

let feedQuery = '';
let feedTimer = null;
async function showFeed() {
  const box = h('div', {}, Array.from({ length: 4 }, () => h('div', { class: 'skel' })));
  const input = h('input', { type: 'search', placeholder: L.searchText, value: feedQuery });
  input.oninput = () => {
    feedQuery = input.value;
    clearTimeout(feedTimer);
    feedTimer = setTimeout(fetchFeed, 350); // ждём, пока человек допечатает
  };
  async function fetchFeed() {
    const asked = feedQuery;
    let data;
    try { data = await call('feed', { type: filter, q: asked }); } catch { return box.replaceChildren(h('div', { class: 'empty' }, L.error)); }
    if (tab !== 'feed' || asked !== feedQuery) return;
    remember(data);
    box.replaceChildren(...listOf(data.items, true, Boolean(asked)));

  view().replaceChildren(h('div', { class: 'fade' },
    me && banners(), segmented(showFeed),
    h('div', { class: 'search' }, h('i', { html: icon('search', 18) }), input),
    box));
  await fetchFeed();
}

// Записи текущего списка — по ним можно листать фото и видео в просмотре.
let currentItems = [];
const isShot = (item) => item.kind === 'photo' || (item.kind === 'document' && /^image\/(jpeg|png|webp|gif)/.test(item.meta?.mime || ''));
const viewable = (item) => me?.pro && item.hasFile && (item.meta?.size || 0) <= (me.inlineMedia || 0)
  && (isShot(item) || ['video', 'video_note'].includes(item.kind));
// Открывает фото или видео записи на весь экран (с процентом загрузки).
async function viewItem(item) {
  toast(L.loadingMedia);
  try {
    const { url } = await mediaUrl(item.id, false, null, (share) => { if (share < 1) toast(percent(share)); });
    openViewer({ type: isShot(item) ? 'image' : 'video', url, item });
  } catch (err) { tg.showAlert(err.message || L.mediaErr); }
}

// Что показать, если список пуст, и чем его рисовать: галереей (для «Медиа») или карточками.
function listOf(items, withName, searching = false) {
  currentItems = items;
  if (!items.length) {
    if (searching) return [empty(L.notFound, '', 'search')];
    if (filter === 'kept') return [empty(L.emptyKept, L.emptyKeptHint, 'star')];
    if (filter === 'media') return [empty(L.emptyMedia, L.emptyMediaHint)];
    return [empty(L.emptyFeed, L.emptyFeedHint)];
  }
  return filter === 'media' ? [gallery(items)] : events(items, withName);
}

// Галерея: сетка из удалённых фото и видео. Нажатие открывает на весь экран.
function gallery(items) {
  return h('div', { class: 'grid fade' }, items.map((item) => {
    const meta = item.meta || {};
    const isPhoto = item.kind === 'photo';
    const small = (meta.size || 0) <= (me.inlineMedia || 0);
    const cell = h('button', { class: 'cell' }, h('i', { html: icon(me.pro ? 'file' : 'lock', 24) }),
      h('span', { class: 'who' }, item.name), !isPhoto && h('span', { class: 'dur' }, meta.duration ? `▶ ${mmss(meta.duration)}` : '▶'));
    if (me.pro && (item.hasThumb || (isPhoto && small))) {
      cell.load = () => mediaUrl(item.id, item.hasThumb).then(({ url }) => cell.prepend(h('img', { src: url, alt: '' })), () => {});
      lazy.observe(cell);
    }
    cell.onclick = async () => {
      haptic();
      if (!me.pro) return toast(L.fileLocked);
      if (!small) { try { toast((await call('sendMedia', { id: item.id })).message); } catch (err) { tg.showAlert(err.message || L.error); } return; }
      viewItem(item);
    };
    return cell;
  }));
}

// Список событий с разделителями по дням.
function events(items, withName) {
  const out = [];
  let last = '';
  for (const item of items) {
    const key = dayKey(item.at);
    if (key !== last) { out.push(h('div', { class: 'day' }, h('span', {}, dayName(item.at)))); last = key; }
    out.push(eventCard(item, withName));
  }
  return out;
}

const KIND_EMOJI = { text: '💬', photo: '🖼', video: '📹', video_note: '⭕', voice: '🎤', audio: '🎵', document: '📎', animation: '🎞', sticker: '🙂', other: '💬' };
const kindLabel = (kind, meta = {}) => `${KIND_EMOJI[kind] || '💬'} ${[meta.type ? L.types[meta.type] : L.kinds[kind] || L.kinds.other, meta.emoji, meta.title].filter(Boolean).join(' · ')}`;

// Сравнивает два текста по словам. Возвращает кусочки второго ('same' | 'add') или первого ('same' | 'del').
function diffWords(a, b) {
  const A = a.split(/(\s+)/); const B = b.split(/(\s+)/);
  if (A.length > 400 || B.length > 400) return null; // слишком длинно — показываем без подсветки
  const n = A.length; const m = B.length;
  const lcs = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) lcs[i][j] = A[i] === B[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
  const removed = []; const added = [];
  let i = 0; let j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { removed.push([A[i], false]); added.push([B[j], false]); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) removed.push([A[i++], true]);
    else added.push([B[j++], true]);
  }
  while (i < n) removed.push([A[i++], true]);
  while (j < m) added.push([B[j++], true]);
  return { removed, added };
}
// Текст с подсветкой: marks — пары [кусочек, выделить ли], cls — чем выделять.
const marked = (marks, cls) => marks.map(([part, hit]) => (hit && part.trim() ? h('span', { class: cls }, part) : part));

function textBlock(content, long) {
  const node = h('div', { class: 'bubble clamp' }, content);
  if (!long) return [node];
  const more = h('button', { class: 'more', onclick: () => { node.classList.remove('clamp'); more.remove(); } }, L.more);
  return [node, more];
}
const isLong = (text) => text.length > 420 || text.split('\n').length > 9;

// Звёздочка-закладка: сообщение с ней не стирается по сроку хранения.
function keepButton(item) {
  const btn = h('button', { class: `star${item.kept ? ' on' : ''}` }, item.kept ? '★' : '☆');
  btn.onclick = async () => {
    haptic('medium');
    const next = !item.kept;
    try {
      await call('settings', { keep: { id: item.id, on: next } });
      item.kept = next;
      btn.className = `star${next ? ' on' : ''}`;
      btn.textContent = next ? '★' : '☆';
      toast(next ? L.keptOn : L.keptOff);
    } catch (err) { tg.showAlert(err.message || L.error); }
  };
  return btn;
}

function eventCard(item, withName) {
  const meta = item.meta || {};
  const cls = item.deletedAt && item.editedAt ? 'both' : item.deletedAt ? 'deleted' : 'edited';
  const card = h('div', { class: `ev ${cls}` });

  card.append(h('div', { class: 'ev-head' },
    withName && avatar(item.name, item.chatId, 'small'),
    withName && h('div', { class: 'who' }, item.name),
    item.deletedAt && h('span', { class: 'tag red' }, `🗑 ${L.tagDeleted}`),
    item.editedAt && h('span', { class: 'tag amber' }, `✏️ ${L.tagEdited}`),
    h('time', { style: withName ? '' : 'margin-left:auto' }, clock(item.at)),
    keepButton(item)));

  if (item.kind !== 'text') card.append(h('div', { class: 'kindline' }, kindLabel(item.kind, meta)));

  if (item.versions.length) {
    // История правок: лента версий от самой старой к нынешней, изменённые слова подсвечены.
    const texts = [...item.versions.map((v) => v.text), item.text];
    const hist = h('div', { class: 'hist' });
    item.versions.forEach((v, i) => {
      const d = diffWords(texts[i], texts[i + 1]);
      const ver = h('div', { class: 'ver' },
        h('div', { class: 'ver-head' }, `📝 ${item.versions.length > 1 ? fill(L.vStep, { n: i + 1 }) : L.vWas}`, h('time', {}, `· ${stamp(i === 0 ? item.date : item.versions[i - 1].at)}`)),
        v.kind && h('div', { class: 'kindline' }, kindLabel(v.kind)),
        (v.text || !v.kind) && textBlock(d ? marked(d.removed, 'del-w') : (v.text || '—'), isLong(v.text)));
      if (v.hasFile && me.pro) {
        const visual = ['photo', 'video', 'video_note', 'animation'].includes(v.kind);
        ver.append(h('button', { class: 'mini', onclick: async () => {
          haptic();
          if (!visual) { try { toast((await call('sendMedia', { id: item.id, edit: v.id })).message); } catch (err) { tg.showAlert(err.message || L.error); } return; }
          toast(L.loadingMedia);
          try { const { url } = await mediaUrl(item.id, false, v.id); openViewer({ type: v.kind === 'photo' ? 'image' : 'video', url, item, edit: v.id }); } catch (err) { tg.showAlert(err.message || L.mediaErr); }
        } }, visual ? `👁 ${L.oldFile}` : `📥 ${L.oldFileChat}`));
      }
      hist.append(ver);
    });
    const last = diffWords(texts.at(-2), texts.at(-1));
    hist.append(h('div', { class: 'ver now' },
      h('div', { class: 'ver-head' }, `✅ ${L.vNow}`, h('time', {}, `· ${stamp(item.versions.at(-1).at)}`)),
      textBlock(item.text ? (last ? marked(last.added, 'add-w') : item.text) : '—', isLong(item.text))));
    card.append(h('div', { class: 'hist-title' }, `✏️ ${L.history} · ${item.versions.length}`), hist);
  } else if (item.text) {
    card.append(...textBlock(item.text, isLong(item.text)));
  }

  // Подробности: когда отправлено, когда удалено, сколько «прожило», данные файла и т. д.
  const facts = h('div', { class: 'facts' });
  const fact = (label, value) => facts.append(h('span', { class: 'fact' }, `${label} `, value !== undefined && h('b', {}, value)));
  fact(L.sentAt, stamp(item.date));
  if (item.deletedAt) fact(L.deletedAt, `${stamp(item.deletedAt)}${item.deletedAt >= item.date ? ` · ${L.after} ${span(item.deletedAt - item.date)}` : ''}`);
  if (item.editedAt) fact(L.editedAt, `${stamp(item.editedAt)}${item.versions.length > 1 ? ` · ${item.versions.length} ${L.edits}` : ''}`);
  if (meta.duration) fact(L.duration, mmss(meta.duration));
  if (meta.size) fact(L.size, bytes(meta.size));
  if (meta.fileName) fact(L.file, meta.fileName);
  if (meta.dim) fact(L.dim, meta.dim);
  if (meta.forward) fact(L.forward, meta.forward);
  if (meta.reply) fact(L.reply);
  if (meta.viaBot) fact(L.viaBot, `@${meta.viaBot}`);
  if (meta.album) fact(L.album);
  if (meta.spoiler) fact(L.spoiler);
  if (meta.links) fact(L.links, meta.links);
  if (withName && item.username) fact('@', item.username);
  card.append(facts);

  if (item.hasFile && me.pro) {
    card.append(mediaBox(item), toChatButton(item, L.getFile));
  } else if (item.hasFile) {
    card.append(h('div', { class: 'lock' }, L.fileLocked));
  }
  return card;
}

// ---------- показ фото, видео и голосовых прямо в приложении ----------
const mediaCache = new Map(); // чтобы не скачивать один файл дважды
// Файл приходит с сервера частями (так большой файл не «подвешивает» запрос) и склеивается здесь без изменений —
// то есть в том же качестве, в каком его отдал Telegram. onProgress(доля) вызывается после каждой части.
const mediaWatchers = new Map();
async function mediaUrl(id, thumb = false, edit = null, onProgress = null) {
  const key = `${id}:${thumb}:${edit}`;
  if (onProgress) mediaWatchers.set(key, onProgress);
  if (!mediaCache.has(key)) {
    const load = async () => {
      const chunks = [];
      let parts = 1; let mime = '';
      for (let part = 0; part < parts; part++) {
        const res = await call('media', { id, thumb, edit, part });
        const raw = atob(res.data);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        chunks.push(bytes);
        parts = Math.min(res.parts || 1, 64);
        mime = res.mime;
        mediaWatchers.get(key)?.((part + 1) / parts);
      }
      return { url: URL.createObjectURL(new Blob(chunks, { type: mime })), mime };
    };
    mediaCache.set(key, load().catch((err) => { mediaCache.delete(key); throw err; }).finally(() => mediaWatchers.delete(key)));
  }
  return mediaCache.get(key);
}
const percent = (share) => `${L.loadingMedia} ${Math.round(share * 100)}%`;
// Загружает картинку, только когда карточка появилась на экране.
const lazy = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { lazy.unobserve(e.target); e.target.load(); }
}, { rootMargin: '300px' });

function toChatButton(item, label, edit = null) {
  const btn = h('button', { class: 'btn ghost' }, h('i', { html: icon('send', 16) }), label);
  btn.onclick = async () => {
    haptic('medium');
    btn.disabled = true;
    try { toast((await call('sendMedia', { id: item.id, edit })).message); } catch (err) { tg.showAlert(err.message || L.error); }
    btn.disabled = false;
  };
  return btn;
}

// Просмотр на весь экран, как в чате: щипок — приблизить, двойное касание — приблизить и вернуть, крестик или «назад» — закрыть.
let viewer = null;
function closeViewer() {
  if (!viewer) return false;
  viewer.remove();
  viewer = null;
  chrome(); // вернуть кнопку «назад» в прежнее состояние
  return true;
}
function openViewer({ type, url, item, edit = null }) {
  closeViewer();
  const media = type === 'image'
    ? h('img', { src: url, alt: '', draggable: 'false' })
    : h('video', { src: url, controls: '', autoplay: '', playsinline: '' });
  const stage = h('div', { class: 'stage' }, media);
  // Соседние фото и видео из того же списка — для листания. У прежних версий файла (edit) листания нет.
  const list = edit === null ? currentItems.filter(viewable) : [];
  const index = list.findIndex((x) => x.id === item.id);
  const step = (d) => { const next = list[index + d]; if (next) { haptic(); viewItem(next); } };
  const bar = h('div', { class: 'bar' },
    h('button', { class: 'x', html: icon('x', 20), onclick: closeViewer }),
    h('div', {}, h('b', {}, item.name), h('span', {}, `${dayName(item.date)}, ${clock(item.date)}`)),
    index >= 0 && list.length > 1 && [
      h('span', { class: 'count' }, `${index + 1} / ${list.length}`),
      h('button', { class: 'nav-btn', html: icon('left', 20), disabled: index === 0 ? '' : null, onclick: () => step(-1) }),
      h('button', { class: 'nav-btn', html: icon('chev', 20), disabled: index === list.length - 1 ? '' : null, onclick: () => step(1) }),
    ]);
  const foot = h('div', { class: 'foot' }, item.text && edit === null && h('p', {}, item.text), toChatButton(item, L.getFile, edit));
  viewer = h('div', { class: 'viewer' }, bar, stage, foot);
  document.body.append(viewer);
  tg.BackButton.show();

  if (type !== 'image') { media.onerror = () => { closeViewer(); tg.showAlert(L.mediaErr); }; return; }
  // Жесты для фото: щипок — приблизить, двойное касание — приблизить и вернуть,
  // без увеличения: влево-вправо — листать, вниз — закрыть.
  let scale = 1; let x = 0; let y = 0; let start = null; let lastTap = 0;
  const paint = (smooth) => {
    if (scale > 1) { // при увеличении не даём утащить картинку за край
      const maxX = (stage.clientWidth * (scale - 1)) / 2; const maxY = (stage.clientHeight * (scale - 1)) / 2;
      x = Math.max(-maxX, Math.min(maxX, x)); y = Math.max(-maxY, Math.min(maxY, y));
    }
    media.style.transition = smooth ? 'transform .2s' : 'none';
    media.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    bar.style.opacity = foot.style.opacity = scale > 1 ? '0' : '1';
    bar.style.pointerEvents = foot.style.pointerEvents = scale > 1 ? 'none' : '';
  };
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) start = { d: dist(e.touches), scale };
    else if (e.touches.length === 1) start = { px: e.touches[0].clientX, py: e.touches[0].clientY, x, y, moved: false, axis: null };
  }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    if (!start) return;
    e.preventDefault();
    if (e.touches.length === 2 && start.d) scale = Math.max(1, Math.min(6, start.scale * (dist(e.touches) / start.d)));
    else if (e.touches.length === 1 && start.px !== undefined) {
      const dx = e.touches[0].clientX - start.px; const dy = e.touches[0].clientY - start.py;
      if (Math.abs(dx) + Math.abs(dy) > 8) start.moved = true;
      if (scale > 1) { x = start.x + dx; y = start.y + dy; }
      else {
        // Без увеличения двигаем только по одной оси: по той, куда палец пошёл сначала.
        if (!start.axis && start.moved) start.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        x = start.axis === 'x' ? dx : 0;
        y = start.axis === 'y' ? Math.max(0, dy) : 0;
      }
    }
    paint(false);
  }, { passive: false });
  stage.addEventListener('touchend', (e) => {
    if (e.touches.length) { start = null; return; }
    if (scale <= 1) {
      if (y > 110) return closeViewer();
      if (Math.abs(x) > 70 && list[index + (x < 0 ? 1 : -1)]) return step(x < 0 ? 1 : -1);
      x = 0; y = 0;
    }
    const tap = start && !start.moved && start.px !== undefined;

  stage.addEventListener('dblclick', () => { scale = scale > 1 ? 1 : 2.500; x = 0; y = 0; paint(true); });

  jpg: '#22b8e6', jpeg: '#22b8e6', png: '#22b8e6', webp: '#22b8e6', heic: '#22b8e6', json: '#7a8194', html: '#f0731b', exe: '#e5484d' };
function fileCard(item, fallback) {
  const meta = item.meta || {};
  const name = meta.fileName || meta.title || fallback;
  const ext = (/\.([a-z0-9]{1,5})$/i.exec(meta.fileName || '')?.[1] || (meta.mime || '').split('/')[1] || 'file').toLowerCase().slice(0, 4);
  const tile = h('div', { class: 'ext', style: `background:${EXT_COLOR[ext] || '#7a8194'}` }, ext.toUpperCase());
  if (item.hasThumb) {
    tile.load = () => mediaUrl(item.id, true).then(({ url }) => tile.replaceChildren(h('img', { src: url, alt: '' })), () => {});
    lazy.observe(tile);
  }
  return h('div', { class: 'filecard' }, tile,
    h('div', { class: 'info' }, h('b', {}, name),

}

function mediaBox(item) {
  const meta = item.meta || {};
  const big = (meta.size || 0) > (me.inlineMedia || 0);
  const kind = item.kind;
  const isImage = kind === 'photo' || (kind === 'sticker' && meta.sticker !== 'video' && meta.sticker !== 'animated') || (kind === 'document' && /^image\/(jpeg|png|webp|gif)/.test(meta.mime || ''));
  const isVideo = ['video', 'video_note', 'animation'].includes(kind) || (kind === 'sticker' && meta.sticker === 'video');
  const isAudio = kind === 'voice' || kind === 'audio';
  // Документы (PDF, Excel, архивы…) и всё, что слишком велико для показа здесь, — карточкой файла.
  if (big || !(isImage || isVideo || isAudio)) return fileCard(item, L.kinds[kind] || L.kinds.other);

  const box = h('div', { class: `media${kind === 'video_note' ? ' round' : ''}${kind === 'sticker' ? ' sticker' : ''}` });
  const note = h('div', { class: 'wait' }, L.loadingMedia);
  const wait = () => { note.textContent = L.loadingMedia; box.replaceChildren(note); };
  const progress = (share) => { if (share < 1) note.textContent = percent(share); };
  const fail = (err) => box.replaceChildren(h('div', { class: 'wait' }, err?.message && err.type === 'ENDPOINT_ERROR' ? err.message : L.mediaErr));
  const inline = kind === 'sticker' || kind === 'animation'; // стикеры и GIF играют прямо в карточке

  if (isImage) {
    wait();
    box.load = () => mediaUrl(item.id, false, null, progress).then(({ url }) => {
      const img = h('img', { src: url, alt: '' });
      if (kind !== 'sticker') img.onclick = () => { haptic(); openViewer({ type: 'image', url, item }); };
      img.style.cursor = kind === 'sticker' ? '' : 'zoom-in';
      box.replaceChildren(img);
    }, fail);
    lazy.observe(box);
  } else if (isVideo) {
    const button = h('button', { class: 'play' }, h('i', { html: icon('play', 24) }));
    const restore = () => box.replaceChildren(...kept);
    let kept = [button];
    button.onclick = () => {
      haptic();
      wait();
      mediaUrl(item.id, false, null, progress).then(({ url }) => {
        if (!inline) { restore(); return openViewer({ type: 'video', url, item }); }
        const video = h('video', { src: url, autoplay: '', playsinline: '', loop: '' });
        video.muted = true;
        video.onerror = () => fail();
        box.replaceChildren(video);
      }, fail);
    };
    box.style.minHeight = '150px';
    box.append(button);
    if (item.hasThumb) {
      box.load = () => mediaUrl(item.id, true).then(({ url }) => {
        const img = h('img', { src: url, alt: '', style: 'cursor:pointer' });
        kept = [img, button];
        if (button.isConnected) box.prepend(img);
      }, () => {});
      lazy.observe(box);
    }
  } else {
    box.append(h('button', { class: 'listen', onclick: () => {
      haptic();
      wait();
      mediaUrl(item.id, false, null, progress).then(({ url }) => {
        const audio = h('audio', { src: url, controls: '', autoplay: '' });
        audio.onerror = () => fail();
        box.replaceChildren(audio);
      }, fail);
    } }, h('i', { html: icon('play', 16) }), `${L.listen}${meta.duration ? ` · ${mmss(meta.duration)}` : ''}`));
  }
  return box;
}

function bars(values, colors, labels) {
  const max = Math.max(1, ...values.map((v) => v.reduce((a, b) => a + b, 0)));
  const chart = h('div', { class: 'chart' }, values.map((parts) => h('div', { class: `col${parts.every((p) => !p) ? ' zero' : ''}` },
    parts.map((p, i) => p > 0 && h('div', { class: `bar ${colors[i]}`, style: `height:${Math.max(4, (p / max) * 100)}%`, title: p })).reverse())));
  return [chart, h('div', { class: 'axis' }, labels.map((l) => h('span', {}, l)))];
}

        h('div', { class: 'ic violet', html: icon('home', 18) }),
        h('div', { class: 'mid' }, h('div', {}, L.home), h('small', {}, L.homeHint)),
        h('i', { class: 'chev', html: icon('chev', 18) }))),
    h('div', { class: 'card' },
      h('button', { class: 'opt', onclick: () => tg.showConfirm(L.wipeAsk, (ok) => { if (ok) { chatsCache = []; save({ wipe: true }).then(() => toast(L.wiped)); } }) },
        h('div', { class: 'ic red', html: icon('trash', 18) }),
        h('div', { class: 'mid' }, h('div', { style: 'color:var(--red)' }, L.wipe), h('small', {}, L.wipeHint)))),
    h('p', { class: 'hint', style: 'margin:12px 6px; text-align:center' }, L.privacy),
  ));
}

// ============================================================================
// Экран «Админ»: только для владельца бота (проверяется на сервере).
// ============================================================================
let adminQuery = '';
async function showAdmin(input = {}) {
  if (!input.action) loading(4);
  let data;
  try { data = await call('admin', input); } catch { toast(L.error); return input.action ? showAdmin() : failed(() => showAdmin()); }
  if (tab !== 'admin') return;
  remember(data);
  const t = data.totals;
  const act = async (payload) => { await showAdmin(payload); toast(L.aDone); };

  const userRow = (u) => h('button', { class: 'row', onclick: () => manage(u) },
    avatar(u.name || String(u.id), u.id),
    h('div', { class: 'mid' },
      h('div', { class: 'name' }, h('span', {}, u.name || `ID ${u.id}`)),
      h('div', { class: 'sub' }, [u.username && `@${u.username}`, `ID ${u.id}`, u.lang.toUpperCase(), shortDate(u.created)].filter(Boolean).join(' · ')),
      h('div', { class: 'sub' }, `${num(u.chats)} ${L.aChatsShort} · 🗑 ${num(u.deleted)} · ✏️ ${num(u.edited)}`)),
    h('div', { class: 'pills' },
      u.owner ? h('span', { class: 'pill vip' }, `👑 ${L.aOwner}`) : u.vip ? h('span', { class: 'pill vip' }, '💎 VIP') : u.pro && h('span', { class: 'pill gold' }, 'PRO'),
      u.banned && h('span', { class: 'pill black' }, `⛔️ ${L.tagBanned}`),
      u.helper && h('span', { class: 'pill red' }, `🛡 ${L.tagHelper}`),
      h('span', { class: `pill ${u.connected ? 'green' : 'gray'}` }, u.connected ? L.aOn : L.aOffline)));

  function manage(u) {
    haptic();
    if (u.owner) return toast(`👑 ${L.planOwner} · VIP`);
    const state = u.vip ? `💎 VIP` : u.pro ? fill(L.until, { date: fullDate(u.proUntil) }) : L.aNoPro;
    sheet(u.name || `ID ${u.id}`, fill(L.aGiveHint, { state }), [
      // VIP и помощников назначает только владелец.
      me.boss && (u.vip ? { text: L.aTakeVip, cls: 'danger', run: () => act({ action: 'vip', userId: u.id, on: false }) }
        : { text: L.aGiveVip, cls: 'primary', run: () => act({ action: 'vip', userId: u.id, on: true }) }),
      { text: `Pro ${L.a30}`, run: () => act({ action: 'pro', userId: u.id, days: 30 }) },
      { text: `Pro ${L.a365}`, run: () => act({ action: 'pro', userId: u.id, days: 365 }) },
      u.pro && !u.vip && { text: L.aOff, cls: 'danger', run: () => act({ action: 'pro', userId: u.id, days: 0 }) },
      me.boss && { text: u.helper ? L.aUnhelper : L.aHelper, run: () => act({ action: 'role', userId: u.id, on: !u.helper }) },
      { text: u.banned ? L.aUnban : L.aBan, cls: u.banned ? '' : 'danger', run: () => act({ action: 'ban', userId: u.id, on: !u.banned }) },
    ].filter(Boolean));
  }

  // Список пользователей с поиском.
  const list = h('div', { class: 'card' });
  const draw = () => {
    const q = adminQuery.trim().toLowerCase();
    const rows = data.users.filter((u) => !q || u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q) || String(u.id).includes(q));
    list.replaceChildren(...rows.map(userRow));
    list.style.display = rows.length ? '' : 'none';
  };
  const find = h('input', { type: 'search', placeholder: L.findUser, value: adminQuery, oninput: (e) => { adminQuery = e.target.value; draw(); } });

  // Выдать VIP по ID.
  const idInput = h('input', { class: 'field', type: 'text', inputmode: 'numeric', placeholder: L.idPlaceholder });
  const giveVip = () => {
    const id = Number(idInput.value.trim());
    if (!Number.isSafeInteger(id) || id <= 0) return toast(L.badId);
    haptic('medium');
    act({ action: 'vip', userId: id, on: true });
  };

  // Рассылка: сервер отправляет порциями, приложение просит следующую, пока не закончится.
  const bcText = h('textarea', { class: 'field', rows: '4', placeholder: L.bcPlaceholder, maxlength: '3500' });
  const bcBtn = h('button', { class: 'btn primary', style: 'margin-top:8px; width:100%' }, h('i', { html: icon('megaphone', 17) }), L.bcSend);
  bcBtn.onclick = () => {
    const text = bcText.value.trim();
    if (!text) return;
    tg.showConfirm(fill(L.bcAsk, { n: t.started }), async (ok) => {
      if (!ok) return;
      bcBtn.disabled = true;
      let sent = 0; let failedCount = 0; let after = 0;
      try {
        while (after !== null) {
          const res = await call('admin', { action: 'broadcast', text, after });
          sent += res.sent; failedCount += res.failed; after = res.next;
          toast(fill(L.bcProgress, { s: sent }));
        }
        bcText.value = '';
        tg.showAlert(fill(L.bcDone, { s: sent, f: failedCount }));
      } catch { tg.showAlert(`${L.error}. ${fill(L.bcDone, { s: sent, f: failedCount })}`); }
      bcBtn.disabled = false;
    });
  };

  // Промокоды.
  const pCode = h('input', { class: 'field', type: 'text', placeholder: L.promoCodeLabel, maxlength: '20', autocapitalize: 'characters' });
  const pDays = h('input', { class: 'field', type: 'text', inputmode: 'numeric', placeholder: L.promoDays, value: '7' });
  const pUses = h('input', { class: 'field', type: 'text', inputmode: 'numeric', placeholder: L.promoUses, value: '10' });
  const addPromo = async () => {
    haptic('medium');
    try { await call('admin', { action: 'promoAdd', code: pCode.value, days: Number(pDays.value), uses: Number(pUses.value) }); } catch { return toast(L.badValues); }
    act({});
  };

  // Цена и лимиты (только владелец).
  const inputs = {};
  const setRows = Object.entries(data.settings).map(([key, v]) => {
    inputs[key] = h('input', { class: 'field', type: 'text', inputmode: 'numeric', value: v.value });
    return h('div', { class: 'setrow' }, h('label', {}, L.setNames[key], h('small', {}, `${v.min}–${v.max}`)), inputs[key]);
  });
  const saveSettings = async () => {
    haptic('medium');
    const values = Object.fromEntries(Object.entries(inputs).map(([key, node]) => [key, Number(node.value)]));
    try { await call('admin', { action: 'settings', values }); } catch { return toast(L.badValues); }
    await showAdmin({});
    toast(L.saved2);
  };

  const stepRow = (label, n) => h('div', { class: 'step' },
    h('div', {}, h('span', {}, label), h('b', {}, `${num(n)} · ${t.started ? Math.round((n / t.started) * 100) : 0}%`)),
    h('div', { class: 'track' }, h('div', { class: 'fill', style: `width:${t.started ? Math.min(100, (n / t.started) * 100) : 0}%` })));

  view().replaceChildren(h('div', { class: 'fade' },
    h('div', { class: 'tiles two' },
      h('div', { class: 'tile' }, h('b', {}, num(t.users)), h('span', {}, L.aUsers)),
      h('div', { class: 'tile green' }, h('b', {}, num(t.conns)), h('span', {}, L.aConn)),
      h('div', { class: 'tile amber' }, h('b', {}, num(t.pro)), h('span', {}, L.aPro)),
      h('div', { class: 'tile violet' }, h('b', {}, `⭐️ ${num(t.stars)}`), h('span', {}, L.aStars))),
    h('div', { class: 'tiles' },
      h('div', { class: 'tile violet' }, h('b', {}, num(t.vip)), h('span', {}, L.aVip)),
      h('div', { class: 'tile red' }, h('b', {}, num(t.deleted)), h('span', {}, L.aDeleted)),
      h('div', { class: 'tile amber' }, h('b', {}, num(t.edited)), h('span', {}, L.aEdited))),
    h('div', { class: 'section' }, L.funnel),
    h('div', { class: 'card pad funnel' }, stepRow(L.fStarted, t.started), stepRow(L.fConnected, t.everConnected), stepRow(L.fPaid, t.paid)),
    h('div', { class: 'section' }, L.aNew),
    h('div', { class: 'card pad' }, bars(data.days.map((d) => [d.users]), ['blue'], data.days.map((d, i) => (i % 2 ? '' : new Date(d.day * 1000).getUTCDate())))),
    me.boss && h('div', { class: 'section' }, L.vipById),
    me.boss && h('div', { class: 'card pad' }, h('div', { class: 'inline' }, idInput, h('button', { class: 'btn primary', onclick: giveVip }, L.give)),
      h('div', { class: 'hint', style: 'margin-top:8px' }, L.vipByIdHint)),
    h('div', { class: 'section' }, `${L.aList} · ${num(t.users)}`),
    data.users.length > 5 && h('div', { class: 'search' }, h('i', { html: icon('search', 18) }), find),
    list,
    h('div', { class: 'section' }, L.promoTitle),
    h('div', { class: 'card pad' },
      h('div', { class: 'promo-form' }, pCode, pDays, pUses),
      h('button', { class: 'btn primary', style: 'margin-top:8px; width:100%', onclick: addPromo }, h('i', { html: icon('ticket', 17) }), L.create),
      data.promos.length ? data.promos.map((p) => h('div', { class: 'setrow', style: 'padding-top:12px' },
        h('label', {}, h('b', {}, p.code), h('small', {}, fill(L.promoUsed, { u: p.used, m: p.maxUses, d: p.days }))),
        h('button', { class: 'mini', style: 'margin:0; color:var(--red)', onclick: () => act({ action: 'promoDel', code: p.code }) }, L.del)))
        : h('div', { class: 'hint', style: 'margin-top:10px' }, L.promoNone)),
    me.boss && h('button', { class: 'btn', style: 'width:100%; margin:0 0 10px; background:var(--card)', onclick: () => tg.showConfirm(L.aPrizeAsk, (ok) => { if (ok) act({ action: 'refPrize' }); }) }, L.aPrize),
    me.boss && h('div', { class: 'section' }, L.setTitle),
    me.boss && h('div', { class: 'card pad' }, setRows,
      h('button', { class: 'btn primary', style: 'margin-top:6px; width:100%', onclick: saveSettings }, L.save),
      h('div', { class: 'hint', style: 'margin-top:8px' }, L.setNote)),
    me.boss && h('div', { class: 'section' }, L.bcTitle),
    me.boss && h('div', { class: 'card pad' }, bcText, bcBtn, h('div', { class: 'hint', style: 'margin-top:8px' }, L.bcHint)),
    h('div', { class: 'section' }, L.aPays),
    h('div', { class: 'card' }, data.payments.length
      ? data.payments.map((p) => h('div', { class: 'kv' }, h('span', {}, `ID ${p.userId} · ${stamp(p.at)}`), h('b', {}, `⭐️ ${num(p.stars)}`)))
      : h('div', { class: 'pad hint' }, L.aNoPays)),
    h('div', { class: 'card' },
      h('div', { class: 'kv' }, h('span', {}, L.aChats), h('b', {}, num(t.chats))),
      h('div', { class: 'kv' }, h('span', {}, L.aMsgs), h('b', {}, num(t.msgs))),
      h('div', { class: 'kv' }, h('span', {}, L.aRefs), h('b', {}, num(t.refs)))),
    h('p', { class: 'hint', style: 'margin:12px 6px; text-align:center' }, L.aNote),
  ));
  draw();
}

go('chats');
</script>
</body>
</html>
